name: Build JeV (Soul)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 关键：不要用 android-actions/setup-android —— 它会去装早已下架的
      # "tools" 包，直接 sdkmanager failed（v1 实测踩过）。GitHub 的 runner
      # 自带 Android SDK，这里只补平台包并接受许可，全部容错。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDK=$SDK"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "--- platforms ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || true

      # 官方用自己的 keystore 签，没给我们 —— 这里自己生成一个。
      - name: 生成签名 keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/jev-release.jks" \
            -alias jev \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jevpass1234 -keypass jevpass1234 \
            -dname "CN=Jev Custom, OU=Self, O=Self, L=NA, ST=NA, C=CN"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/jev-release.jks" jevpass1234 jev jevpass1234 \
            > "$RUNNER_TEMP/jev-release.properties"

      - name: 编译 release APK
        env:
          JEV_KEYSTORE_PROPS: ${{ runner.temp }}/jev-release.properties
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-soul-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
