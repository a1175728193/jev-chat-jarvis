name: Build JeV (Soul)

# 手动触发，或推送时自动跑
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      # 官方用自己的 keystore 签，没给我们 —— 这里自己生成一个。
      # 密码写死在 workflow 里没关系，这只是自用包。
      - name: 生成签名 keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/jev-release.jks" \
            -alias jev \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jevpass1234 -keypass jevpass1234 \
            -dname "CN=Jev Custom, OU=Self, O=Self, L=NA, ST=NA, C=CN"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/jev-release.jks" jevpass1234 jev jevpass1234 \
            > "$RUNNER_TEMP/jev-release.properties"

      - name: 编译 release APK
        env:
          JEV_KEYSTORE_PROPS: ${{ runner.temp }}/jev-release.properties
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-soul-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
