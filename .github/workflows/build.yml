name: Build JeV (Soul)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 关键：不要用 android-actions/setup-android —— 它会去装早已下架的
      # "tools" 包，直接 sdkmanager failed。GitHub 的 runner 自带 Android SDK，
      # 这里只补平台包并接受许可，全部容错。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK=$SDK"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

      # 同一把 keystore 跨构建复用 —— 否则每次签名都不同，用户每次都得先卸载，
      # 而卸载会清空 App 内的密钥和设置。key 固定，缓存命中即复用。
      - name: 取回已有 keystore
        id: kscache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jev-ks
          key: jev-release-keystore-v1

      - name: 生成或复用 keystore
        run: |
          mkdir -p "$RUNNER_TEMP/jev-ks"
          KS="$RUNNER_TEMP/jev-ks/jev-release.jks"
          if [ -f "$KS" ]; then
            echo "♻️ 复用已有 keystore（签名一致，可直接覆盖安装）"
          else
            echo "🆕 首次生成 keystore"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias jev \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jevpass1234 -keypass jevpass1234 \
              -dname "CN=Jev Custom, OU=Self, O=Self, L=NA, ST=NA, C=CN"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS" jevpass1234 jev jevpass1234 \
            > "$RUNNER_TEMP/jev-release.properties"

      - name: 编译 release APK
        env:
          JEV_KEYSTORE_PROPS: ${{ runner.temp }}/jev-release.properties
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-soul-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
